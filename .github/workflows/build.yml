
name: Build Malindu PDF Pro APK - Debug Fix

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q -o Malindu_PDF_Pro_Source.zip -d project
          test -f project/app/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build APK and show errors
        working-directory: project
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug > ../build-output.log 2>&1
          result=$?
          echo "===== ACTUAL ERRORS ====="
          grep -nE 'FAILURE:|What went wrong:|Caused by:|^e: |error:|Could not|Unresolved reference|Compilation error|BUILD FAILED' ../build-output.log | tail -n 80 || true
          echo "===== LAST LOG LINES ====="
          tail -n 160 ../build-output.log
          exit "$result"

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Pro-Build-Log
          path: build-output.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Malindu-PDF-Pro-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
