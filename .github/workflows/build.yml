
name: Build Malindu PDF Pro APK (SDK Fix)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Malindu_PDF_Pro_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Extract PDF Pro project
        shell: bash
        run: |
          set -euo pipefail
          test -f Malindu_PDF_Pro_Source.zip
          mkdir -p project
          unzip -q -o Malindu_PDF_Pro_Source.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          java -version

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malindu-PDF-Pro-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
